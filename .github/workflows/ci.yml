name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build:trial
      - run: npm run build:real
      - name: Browser checks
        run: |
          npx playwright-core install --with-deps chromium
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          python3 -m http.server 3002 -d dist-spa >/dev/null 2>&1 &
          sleep 1
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            dist-spa/spa.html
            dist-real/spa.html
