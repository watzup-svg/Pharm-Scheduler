name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # The jobs run side by side: type check, unit tests and builds; the browser suite in two halves; and a sweep of random schedules; and the page sweep with the build guards.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run check:v3
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build:trial
      - run: npm run build:real
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            dist-spa/spa.html
            dist-real/spa.html
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:trial
      - name: Browser checks ${{ matrix.shard }}
        run: |
          npx playwright-core install --with-deps chromium
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run e2e -- --shard ${{ matrix.shard }}
  # The v3 app: build the single file, then run its browser checks (Chromium).
  v3-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck:v3
      - run: npm run build:v3
      - name: v3 browser checks
        run: |
          npx playwright-core install --with-deps chromium
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run e2e:v3
  # The Safari engine (WebKit). Not blocking yet: it is new, so a red here is read first and fixed or excused. Still not a real iPhone.
  webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Two machines, like the Chromium job. On one runner the groups compete for the same cores (measured: 3 groups at once ran about 1.6x slower each), so splitting across machines is where the time comes back.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:trial
      - name: Browser checks in WebKit ${{ matrix.shard }}
        run: |
          npx playwright-core install --with-deps webkit
          BROWSER=webkit npm run e2e -- smoke pages fit dialogs print "phone touch" --shard ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-logs-${{ strategy.job-index }}
          path: test-logs/
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run sweep -- --seeds 20
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results
          path: test-logs/
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:trial
      - run: npm run build:real
      - run: |
          npx playwright-core install --with-deps chromium
          echo "CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Build guards (size, addresses, offline, docs)
        run: git fetch -q origin main:refs/remotes/origin/main || true; npm run guards
      - name: Real build starts clean (Welcome screen, no sample data)
        run: npm run real
      - name: Page sweep (every page and popup, both widths)
        run: npm run screens
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page-sweep
          path: test-logs/
