name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # The three jobs run side by side: type check and unit tests, the browser suite in two halves, and the builds.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build:trial
      - run: npm run build:real
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            dist-spa/spa.html
            dist-real/spa.html
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:trial
      - name: Browser checks ${{ matrix.shard }}
        run: |
          npx playwright-core install --with-deps chromium
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          python3 -m http.server 3002 -d dist-spa >/dev/null 2>&1 &
          sleep 1
          npm run e2e -- --shard ${{ matrix.shard }}
